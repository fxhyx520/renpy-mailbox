<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏邮箱 · 管理后台（云端）</title>
<style>
  :root{
    --bg:#14161b; --panel:#1c1f27; --panel2:#232732; --line:#2e3442;
    --text:#e6e8ee; --dim:#8b93a7; --accent:#5b8cff; --ok:#3ecf8e; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .spacer{flex:1}
  input,textarea,select,button{font:inherit;color:inherit}
  input,textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;line-height:1.7}
  button{background:var(--accent);border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:var(--panel2);border:1px solid var(--line);font-weight:400}
  button.mini{background:transparent;border:1px solid var(--line);padding:2px 8px;font-size:12px;border-radius:6px;font-weight:400}
  button.danger{border-color:#66333a;color:#ff9a9a}
  main{display:grid;grid-template-columns:450px minmax(0,1fr);gap:18px;padding:18px 22px;align-items:start}
  main > div{min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:1px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .row{display:flex;gap:10px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}
  .stats b{color:var(--text);font-size:15px;margin-left:6px}
  .block{border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:9px;overflow:hidden}
  .block .bar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#1a1d25;color:var(--dim);font-size:12px}
  .block .bar .name{flex:1}
  .block .body{padding:8px}
  .block textarea{border:none;background:transparent;padding:2px;min-height:62px}
  .block img{max-width:100%;max-height:120px;display:block;border-radius:6px;background:#0f1116}
  .addbar{display:flex;gap:8px;margin:6px 0 14px}
  .left-col{display:flex;flex-direction:column;gap:14px}
  #send{margin-top:4px}
  .msg{margin-top:8px;font-size:13px;min-height:18px}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .mail{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--panel2);font-size:13px}
  .mail.revoked{opacity:.45}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
  .hint{color:var(--dim);font-size:12px}

  /* ---------- 游戏内邮箱的等比预览 ---------- */
  .preview-wrap{width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#0b0d12;padding:10px;display:flex;justify-content:center}
  .stage{width:1180px;height:650px;flex:0 0 auto;transform-origin:top center;background:#f6f3ec;padding:22px 18px;font-family:"Microsoft YaHei",sans-serif;color:#2f333d;display:flex;flex-direction:column;gap:10px}
  .stage .head{display:flex;align-items:baseline;gap:14px;height:40px}
  .stage .head .t{font-size:30px;font-weight:700}
  .stage .head .btn{font-size:17px;color:#4a4f5a}
  .stage .cols{display:flex;gap:14px;flex:1;min-height:0}
  .stage .list{width:396px;background:#eae5d9;padding:10px;border-radius:4px}
  .stage .item{background:#fffdf8;padding:10px 8px;border-radius:3px}
  .stage .item .tt{font-size:18px;font-weight:600}
  .stage .item .mt{font-size:13px;color:#7b7f8a;margin-top:2px}
  .stage .detail{flex:1;background:#fffdf8;padding:14px 18px;border-radius:4px;overflow:hidden}
  .stage .detail .dt{font-size:24px;font-weight:700;line-height:1.3}
  .stage .detail .dm{font-size:13px;color:#7b7f8a;margin-top:2px}
  .stage .content{width:640px;height:372px;margin-top:10px;overflow:hidden;position:relative}
  .stage .content .tx{white-space:pre-wrap;line-height:1.55;margin-bottom:6px}
  .stage .atts{font-size:16px;margin-top:8px;color:#33373f}
  .stage .atts{font-size:16px;margin-top:8px;color:#33373f}

  /* 手机上单列显示 */
  @media (max-width: 900px){
    main{grid-template-columns:1fr;padding:12px;gap:12px}
    header{flex-wrap:wrap;gap:8px;padding:10px 12px}
    header input{width:100% !important}
    .stats{gap:14px;padding:8px 12px}
    .panel{padding:12px}
  }
</style>
</head>
<body>
<header>
  <h1>✉ 游戏邮箱 · 管理后台</h1>
  <div class="spacer"></div>
  <input id="token" placeholder="管理令牌（admin_token.txt）" style="width:300px">
  <button id="connect">连接</button>
</header>

<div class="stats">
  <span>当前游戏版本<b id="s-version">-</b></span>
  <span>玩家<b id="s-players">-</b></span>
  <span>7 日活跃<b id="s-active">-</b></span>
  <span>邮件<b id="s-mails">-</b></span>
  <span>累计已读<b id="s-reads">-</b></span>
  <span>运行时长<b id="s-uptime">-</b></span>
</div>

<main>
  <div class="left-col">
  <section class="panel">
    <h2>写一封全服邮件</h2>
    <div class="field"><label>标题</label><input id="f-title" placeholder="例如：0.30 版本更新公告"></div>
    <div class="field"><label>发件人</label><input id="f-sender" value="运营组"></div>

    <div class="field">
      <label>正文（右侧实时预览，图片按这里的顺序出现）</label>
      <div id="blocks"></div>
      <div class="addbar">
        <button class="ghost" id="add-text">+ 文字</button>
        <button class="ghost" id="add-image">+ 图片</button>
        <button class="ghost" id="add-space">+ 留白</button>
        <input type="file" id="file" accept="image/*" style="display:none">
      </div>
    </div>

    <div class="field">
      <label>附件（每行一个：物品ID,显示名,数量）</label>
      <textarea id="f-att" rows="2" placeholder="coin,金币,100"></textarea>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>目标平台</label>
        <select id="f-platform"><option value="">全部平台</option><option value="windows">仅 Windows</option><option value="android">仅 Android</option></select>
      </div>
      <div class="field" style="flex:1"><label>最低版本</label><input id="f-minver" placeholder="0.29"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>发布时间（空=立即）</label><input id="f-pub" placeholder="2026-11-10 20:00"></div>
      <div class="field" style="flex:1"><label>过期（空=永久）</label><input id="f-exp" placeholder="2026-12-31 23:59"></div>
    </div>
    <button id="send">发布给所有玩家</button>
    <div class="msg" id="msg"></div>
  </section>

  <section class="panel">
    <h2>已发布邮件</h2>
    <div id="latest"><div class="hint">还没有邮件。</div></div>
    <button class="ghost" id="open-all" style="width:100%;margin-top:10px">展开全部 →</button>
  </section>
  </div>

  <div>
    <section class="panel" style="margin-bottom:18px">
      <h2>实时预览 <span id="pv-zoom" style="float:right;font-weight:400;letter-spacing:0"></span></h2>
      <div class="preview-wrap" id="preview-wrap">
        <div class="stage" id="stage">
          <div class="head">
            <div class="t">邮箱</div>
            <div class="btn">刷新</div><div class="btn">全部已读</div><div class="btn">关闭</div>
          </div>
          <div class="cols">
            <div class="list">
              <div class="item">
                <div class="tt" id="pv-item-title">（标题）</div>
                <div class="mt" id="pv-item-meta">运营组 · 2026-01-01 00:00</div>
              </div>
            </div>
            <div class="detail">
              <div class="dt" id="pv-title">（标题）</div>
              <div class="dm" id="pv-meta">运营组 · 2026-01-01 00:00</div>
              <div class="content" id="pv-content"></div>
              <div class="atts" id="pv-atts"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="hint" style="margin-top:8px">
        这就是玩家打开邮箱看到的样子（整窗等比缩放，右上角是比例）。字体略有差别，位置和尺寸一致。
      </div>
    </section>

  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem("mail_admin_token") || "";
let blocks = [{ type: "text", text: "", size: 19, align: "left" }];

if (TOKEN) $("token").value = TOKEN;

function msg(text, ok) {
  const el = $("msg");
  el.textContent = text || "";
  el.className = "msg " + (ok ? "ok" : "bad");
}

async function api(path, options) {
  options = options || {};
  const headers = { "X-Admin-Token": TOKEN };
  if (options.body) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method: options.method || "GET", headers, body: options.body });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("HTTP " + res.status); }
  if (!res.ok || data.ok === false) throw new Error(data.detail || data.error || ("HTTP " + res.status));
  return data;
}

/* ---------------- 内容块编辑 ---------------- */

function renderBlocks() {
  const box = $("blocks");
  box.innerHTML = "";
  blocks.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "block";

    const bar = document.createElement("div");
    bar.className = "bar";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = (b.type === "text" ? "文字" : (b.type === "space" ? "留白" : "图片")) + " #" + (i + 1);
    const up = document.createElement("button"); up.className = "mini"; up.textContent = "↑";
    const dn = document.createElement("button"); dn.className = "mini"; dn.textContent = "↓";
    const del = document.createElement("button"); del.className = "mini danger"; del.textContent = "删除";
    up.onclick = () => { if (i > 0) { const t = blocks[i-1]; blocks[i-1] = blocks[i]; blocks[i] = t; renderBlocks(); } };
    dn.onclick = () => { if (i < blocks.length - 1) { const t = blocks[i+1]; blocks[i+1] = blocks[i]; blocks[i] = t; renderBlocks(); } };
    del.onclick = () => { blocks.splice(i, 1); renderBlocks(); };
    bar.append(name, up, dn, del);
    el.appendChild(bar);

    const body = document.createElement("div");
    body.className = "body";

    if (b.type === "space") {
      const sel = document.createElement("select");
      [["20", "留白 20"], ["40", "留白 40"], ["60", "留白 60"],
       ["90", "留白 90"], ["130", "留白 130"], ["180", "留白 180"]].forEach(pair => {
        const o = document.createElement("option"); o.value = pair[0]; o.textContent = pair[1]; sel.appendChild(o);
      });
      sel.value = String(b.h || 40);
      sel.onchange = () => { b.h = parseInt(sel.value, 10); renderPreview(); };
      body.appendChild(sel);
      const tip = document.createElement("div");
      tip.className = "hint";
      tip.textContent = "用来把后面的文字往下推，绕开自由摆放的图片";
      body.appendChild(tip);
    } else if (b.type === "text") {
      const ta = document.createElement("textarea");
      ta.value = b.text;
      ta.rows = 3;
      ta.oninput = () => { b.text = ta.value; renderPreview(); };
      body.appendChild(ta);

      const row = document.createElement("div");
      row.className = "row";
      row.style.marginTop = "6px";

      const size = document.createElement("select");
      [["16", "字号 小"], ["19", "字号 中"], ["22", "字号 大"], ["26", "字号 特大"]].forEach(pair => {
        const o = document.createElement("option"); o.value = pair[0]; o.textContent = pair[1]; size.appendChild(o);
      });
      size.value = String(b.size || 19);
      size.onchange = () => { b.size = parseInt(size.value, 10); renderPreview(); };

      const align = document.createElement("select");
      [["left", "左对齐"], ["center", "居中"], ["right", "右对齐"]].forEach(pair => {
        const o = document.createElement("option"); o.value = pair[0]; o.textContent = pair[1]; align.appendChild(o);
      });
      align.value = b.align || "left";
      align.onchange = () => { b.align = align.value; renderPreview(); };

      row.append(size, align);
      body.appendChild(row);
    } else {
      const img = document.createElement("img");
      img.src = b.data;
      body.appendChild(img);

      const row = document.createElement("div");
      row.className = "row";
      row.style.marginTop = "6px";

      const wide = document.createElement("select");
      [["240", "小图 240"], ["320", "中图 320"], ["420", "大图 420"],
       ["520", "很大 520"], ["640", "满宽 640"]].forEach(pair => {
        const o = document.createElement("option"); o.value = pair[0]; o.textContent = pair[1]; wide.appendChild(o);
      });
      wide.value = String(b.w || 320);
      wide.onchange = () => { b.w = parseInt(wide.value, 10); renderPreview(); };

      const align = document.createElement("select");
      [["left", "靠左"], ["center", "居中"], ["right", "靠右"]].forEach(pair => {
        const o = document.createElement("option"); o.value = pair[0]; o.textContent = pair[1]; align.appendChild(o);
      });
      align.value = b.align || "center";
      align.onchange = () => { b.align = align.value; renderPreview(); };

      row.append(wide, align);
      body.appendChild(row);
    }

    el.appendChild(body);
    box.appendChild(el);
  });
  renderPreview();
}

/* ---------------- 实时预览 ---------------- */

function renderPreview() {
  const title = $("f-title").value.trim() || "（标题）";
  const sender = $("f-sender").value.trim() || "运营组";
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());

  $("pv-item-title").textContent = title;
  $("pv-title").textContent = title;
  $("pv-item-meta").textContent = sender + " · " + stamp;
  $("pv-meta").textContent = sender + " · " + stamp;

  const content = $("pv-content");
  content.innerHTML = "";
  blocks.forEach(b => {
    if (b.type === "space") {
      const gap = document.createElement("div");
      gap.style.height = (b.h || 40) + "px";
      content.appendChild(gap);
      return;
    }
    if (b.type === "text") {
      if (!(b.text || "").trim()) return;
      const div = document.createElement("div");
      div.className = "tx";
      div.textContent = b.text;
      div.style.fontSize = (b.size || 19) + "px";
      div.style.textAlign = b.align || "left";
      content.appendChild(div);
    } else if (b.data) {
      const img = document.createElement("img");
      img.src = b.data;
      img.style.display = "block";
      img.style.marginTop = "6px";
      img.style.marginBottom = "6px";
      img.style.width = (b.w || 320) + "px";
      img.style.marginLeft = (b.align === "right" || b.align === "center") ? "auto" : "0";
      img.style.marginRight = (b.align === "left" || b.align === "center") ? "auto" : "0";
      content.appendChild(img);
    }
  });

  const atts = $("f-att").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  $("pv-atts").textContent = atts.length ? "附件： " + atts.map(a => {
    const p = a.split(/[,，]/).map(s => s.trim());
    return (p[1] || p[0]) + " ×" + (p[2] || "1");
  }).join("  ") : "";
}

let SCALE = 1;

function fitPreview() {
  const wrap = $("preview-wrap");
  const available = wrap.clientWidth - 20;
  const scale = Math.max(0.2, Math.min(1, available / 1180));
  SCALE = scale;
  $("stage").style.transform = "scale(" + scale + ")";
  const zoom = $("pv-zoom");
  if (zoom) zoom.textContent = Math.round(scale * 100) + "%";
  wrap.style.height = Math.round(650 * scale + 20) + "px";
}

window.addEventListener("resize", fitPreview);

/* ---------------- 图片：选中后先在浏览器里缩小再上传 ---------------- */

function resizeImage(file, maxW) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (file.type !== "image/png") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      let url = canvas.toDataURL("image/png");
      if (url.length > 600000) url = canvas.toDataURL("image/jpeg", 0.85);
      resolve(url);
    };
    img.onerror = () => reject(new Error("图片读不出来"));
    img.src = URL.createObjectURL(file);
  });
}

$("add-text").onclick = () => { blocks.push({ type: "text", text: "", size: 19, align: "left" }); renderBlocks(); };
$("add-space").onclick = () => { blocks.push({ type: "space", h: 60 }); renderBlocks(); };
$("add-image").onclick = () => $("file").click();
$("file").onchange = async ev => {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  try {
    const data = await resizeImage(file, 900);
    blocks.push({ type: "image", data: data, w: 420, align: "center" });
    renderBlocks();
  } catch (e) { msg("图片处理失败：" + e.message, false); }
};
$("f-title").oninput = renderPreview;
$("f-sender").oninput = renderPreview;
$("f-att").oninput = renderPreview;

/* ---------------- 发布 / 列表 ---------------- */

function parseAttachments(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split(/[,，]/).map(s => s.trim());
    if (!parts[0]) return;
    out.push({ id: parts[0], name: parts[1] || parts[0], count: parseInt(parts[2] || "1", 10) || 1 });
  });
  return out;
}

$("send").onclick = async () => {
  const title = $("f-title").value.trim();
  if (!title) { msg("标题不能为空。", false); return; }

  const audience = {};
  if ($("f-platform").value) audience.platform = $("f-platform").value;
  if ($("f-minver").value.trim()) audience.min_version = $("f-minver").value.trim();

  const payload = {
    title: title,
    sender: $("f-sender").value.trim() || "运营组",
    blocks: blocks.filter(b => b.type === "image" || b.type === "space" || (b.text || "").trim()),
    attachments: parseAttachments($("f-att").value),
    audience: audience
  };
  const pub = $("f-pub").value.trim();
  const exp = $("f-exp").value.trim();
  if (pub) payload.publish_at = pub;
  if (exp) payload.expires_at = exp;

  try {
    const data = await api("/admin/api/mails", { method: "POST", body: JSON.stringify(payload) });
    msg("已发布，邮件 #" + data.id + "。点左边列表里的标题可以看网页版。", true);
    $("f-title").value = ""; $("f-att").value = ""; $("f-pub").value = ""; $("f-exp").value = "";
    blocks = [{ type: "text", text: "", size: 19, align: "left" }];
    renderBlocks();
    loadMails();
    loadStats();
  } catch (e) { msg("发布失败：" + e.message, false); }
};

async function loadStats() {
  try {
    const d = await api("/admin/api/stats");
    $("s-version").textContent = d.game_version || "—";
    $("s-players").textContent = d.players;
    $("s-active").textContent = d.active7 == null ? "—" : d.active7;
    $("s-mails").textContent = d.live_mails;
    $("s-reads").textContent = d.reads;
    $("s-uptime").textContent = Math.floor(d.uptime / 3600) + " 小时";
  } catch (e) {}
}

function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function fmtTime(ts) {
  if (!ts) return "-";
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

async function loadMails() {
  try {
    const data = await api("/admin/api/mails");
    const box = $("latest");
    box.innerHTML = "";

    if (!data.mails.length) {
      box.innerHTML = '<div class="hint">还没有邮件。</div>';
      return;
    }

    const m = data.mails[0];
    const card = document.createElement("div");
    card.className = "mail";

    const head = document.createElement("div");
    const link = document.createElement("a");
    link.textContent = m.title;
    link.href = "/mail/" + m.id;
    link.target = "_blank";
    link.style.color = "inherit";
    link.style.textDecoration = "none";
    head.appendChild(link);
    const minVersion = (m.audience && m.audience.min_version) || "";
    head.insertAdjacentHTML("beforeend",
      (m.revoked ? '<span class="tag">已撤回</span>' : '<span class="tag">生效中</span>') +
      '<span class="tag">' + m.read_count + ' 已读</span>' +
      '<span class="tag">' + m.claim_count + ' 领取</span>' +
      '<span class="tag">' + (minVersion ? minVersion + ' 及以上' : '全部版本') + '</span>');

    const meta = document.createElement("div");
    meta.className = "hint";
    meta.textContent = "#" + m.id + " · " + fmtTime(m.published_at) + " · 共 " + data.mails.length + " 封";

    card.append(head, meta);

    if (!m.revoked) {
      const btn = document.createElement("button");
      btn.className = "mini danger";
      btn.textContent = "撤回";
      btn.style.marginTop = "6px";
      btn.onclick = async () => {
        if (!confirm("撤回后玩家不再看到这封邮件，确定？")) return;
        try { await api("/admin/api/mails/" + m.id + "/retract", { method: "POST", body: "{}" }); loadMails(); }
        catch (e) { alert(e.message); }
      };
      card.appendChild(btn);
    }

    box.appendChild(card);
  } catch (e) {}
}

/* ---------------- 两台机器合并 ---------------- */

function syncMsg(text, ok) {
  const el = $("sync-msg");
  el.textContent = text || "";
  el.className = "msg " + (ok ? "ok" : "bad");
}

function describe(d, action) {
  const parts = [];
  if (d.mails_new) parts.push("新增邮件 " + d.mails_new);
  if (d.mails_updated) parts.push("更新邮件 " + d.mails_updated);
  if (d.players_new) parts.push("新增玩家 " + d.players_new);
  if (d.receipts_new) parts.push("新增已读 " + d.receipts_new);
  if (!parts.length) return action + "完成：两边已经一致，没有新内容。";
  return action + "完成：" + parts.join("，") + "。";
}

async function doSync(kind) {
  const peer_url = $("sync-url").value.trim();
  const peer_token = $("sync-token").value.trim();
  if (!peer_url) { syncMsg("先填对方地址。", false); return; }

  syncMsg("正在连接…", true);
  try {
    let text = "";
    if (kind === "pull" || kind === "both") {
      const d = await api("/admin/api/sync/pull", {
        method: "POST", body: JSON.stringify({ peer_url: peer_url, peer_token: peer_token })
      });
      text += describe(d, "拉取");
    }
    if (kind === "push" || kind === "both") {
      const d = await api("/admin/api/sync/push", {
        method: "POST", body: JSON.stringify({ peer_url: peer_url, peer_token: peer_token })
      });
      text += (text ? " / " : "") + describe(d, "推送");
    }
    syncMsg(text, true);
    loadMails();
    loadStats();
  } catch (e) {
    syncMsg("同步失败：" + e.message, false);
  }
}

$("open-all").onclick = () => window.open("/mails", "_blank");

$("connect").onclick = async () => {
  TOKEN = $("token").value.trim();
  localStorage.setItem("mail_admin_token", TOKEN);
  try {
    await api("/admin/api/stats");
    msg("已连接。", true);
    loadStats();
    loadMails();
  } catch (e) { msg("连接失败：" + e.message, false); }
};
